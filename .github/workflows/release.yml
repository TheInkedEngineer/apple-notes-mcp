name: release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  build:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift build -c release
      - run: |
          mkdir -p dist
          cp .build/release/apple-notes-mcp dist/apple-notes-mcp
          tar -czf dist/apple-notes-mcp_darwin_arm64.tar.gz -C dist apple-notes-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: darwin_arm64
          path: dist/apple-notes-mcp_darwin_arm64.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true
